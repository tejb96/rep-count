name: Frontend Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: ./frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
        if: steps.cache-npm.outputs.cache-hit !='true'

      - name: Install frontend dependencies (with cache hit)
        working-directory: ./frontend
        run: npm install --prefer-offline --no-audit
        if: steps.cache-npm.outputs.cache-hit == 'true'

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Configure AWS credentials with IAM Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check changed files
        id: changes
        run: |
          # Get changed files from this push
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          echo "Changed files in this push:"
          echo "$CHANGED_FILES"
          # Check if changes are only in frontend/src/
          if echo "$CHANGED_FILES" | grep -v '^frontend/src/' > /dev/null; then
            echo "Changes outside frontend/src/ detected. Will sync all."
            echo "sync_all=true" >> $GITHUB_OUTPUT
          else
            echo "Changes only in frontend/src/. Will sync specific files."
            echo "sync_all=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync src-only files to S3
        id: s3-src-only
        if: steps.changes.outputs.sync_all != 'true'
        run: |
          > sync_output.txt
          # Sync index.html (replaces existing)
          aws s3 cp ./frontend/build/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html >> sync_output.txt 2>&1
          # Sync static folder (replaces changed files, deletes obsolete)
          aws s3 sync ./frontend/build/static/ s3://${{ secrets.S3_BUCKET_NAME }}/static/ --delete --size-only >> sync_output.txt 2>&1
          cat sync_output.txt

      - name: Invalidate src-only CloudFront Cache
        id: invalidate-src-only
        if: steps.changes.outputs.sync_all != 'true'
        run: |
          echo "Invalidating specific files: /index.html /static/*"
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html /static/*"
        env:
          AWS_MAX_ATTEMPTS: 3

      - name: Sync all files to S3
        id: s3-all
        if: steps.changes.outputs.sync_all == 'true'
        run: |
          > sync_output.txt
          # Sync entire build folder (replaces all matching, deletes obsolete)
          aws s3 sync ./frontend/build/ s3://${{ secrets.S3_BUCKET_NAME }}/ --delete --size-only >> sync_output.txt 2>&1
          cat sync_output.txt

      - name: Invalidate all CloudFront Cache
        id: invalidate-all
        if: steps.changes.outputs.sync_all == 'true'
        run: |
          echo "Invalidating all files: /*"
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
        env:
          AWS_MAX_ATTEMPTS: 3