name: Frontend Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: ./frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
        if: steps.cache-npm.outputs.cache-hit !='true'

      - name: Install frontend dependencies (with cache hit)
        working-directory: ./frontend
        run: npm install --prefer-offline --no-audit
        if: steps.cache-npm.outputs.cache-hit == 'true'

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Configure AWS credentials with IAM Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Sync src-only files to S3
        id: s3-src-only
        run: |
          aws s3 cp ./frontend/build/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html > /dev/null 2>&1
          aws s3 sync ./frontend/build/static/ s3://${{ secrets.S3_BUCKET_NAME }}/static/ --delete > /dev/null 2>&1

      - name: Invalidate src-only CloudFront Cache
        id: invalidate-src-only
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/static/*" > /dev/null 2>&1
        env:
          AWS_MAX_ATTEMPTS: 3

#
